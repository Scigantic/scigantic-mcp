name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor declared in pyproject (the mcp SDK's own floor).
        # Keeping it in the matrix is what proves that claim stays true. 3.14
        # is in the mcp SDK's own classifiers, matching sibling scigantic-pubchem.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install + test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          mypy --strict scigantic_mcp
